# Render Blueprint: API + background worker + PostgreSQL. See docs/DEPLOYMENT.md.
# The web app is deployed separately on Vercel (apps/web/vercel.json).
# Values marked `sync: false` are asked for in the Render dashboard when the Blueprint is created.

databases:
  - name: kavach-db
    databaseName: kavach
    user: kavach
    plan: basic-256mb # the free plan is deleted after 30 days
    postgresMajorVersion: '16'

envVarGroups:
  - name: kavach-shared
    envVars:
      - key: NODE_VERSION
        value: '22.23.5'
      - key: DOCUMENT_QUEUE
        value: db # PostgreSQL-backed queue: no Redis needed
      - key: STORAGE_DRIVER
        value: s3 # API and worker run on different machines, so files must live in S3/R2
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false # e.g. https://<account-id>.r2.cloudflarestorage.com (leave empty for AWS S3)
      - key: S3_REGION
        sync: false # "auto" for Cloudflare R2, e.g. "ap-south-1" for AWS
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'true'

services:
  - type: web
    name: kavach-api
    runtime: node
    plan: starter
    buildCommand: >-
      npx --yes pnpm@12.21.0 install --frozen-lockfile --filter @kavach/api... &&
      npx --yes pnpm@12.21.0 exec turbo run build --filter=@kavach/api
    preDeployCommand: npx --yes pnpm@12.21.0 --filter @kavach/db migrate:deploy
    # NODE_ENV is set only at start so the build still installs dev dependencies (nest, tsc).
    startCommand: cd apps/api && NODE_ENV=production node dist/main.js
    healthCheckPath: /health
    envVars:
      - fromGroup: kavach-shared
      - key: DATABASE_URL
        fromDatabase:
          name: kavach-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: TRUST_PROXY
        value: '1'
      - key: WEB_ORIGIN
        sync: false # e.g. https://app.yourcompany.com (must be on the same domain as the API)

  - type: worker
    name: kavach-worker
    runtime: node
    plan: starter
    buildCommand: >-
      npx --yes pnpm@12.21.0 install --frozen-lockfile --filter @kavach/worker... &&
      npx --yes pnpm@12.21.0 exec turbo run build --filter=@kavach/worker
    startCommand: cd apps/worker && NODE_ENV=production node dist/main.js
    envVars:
      - fromGroup: kavach-shared
      - key: DATABASE_URL
        fromDatabase:
          name: kavach-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false # optional: without it, invoices are typed in by hand
